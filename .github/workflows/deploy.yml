name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Restart on VPS
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}

            # 1. Latest code khinch lo (.env untracked hai, safe rehta hai)
            echo "--- Syncing repo ---"
            git fetch origin main
            git reset --hard origin/main

            # 2. VPS pe hi image build karo
            echo "--- Building image on VPS ---"
            docker compose -f docker-compose.prod.yml build

            # 3. Restart
            echo "--- Restarting services ---"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4. Verify
            echo "--- Verifying Deployment ---"
            sleep 20

            if ! curl -f http://localhost:5000/health; then
              echo "FAILED: App is crashing or not responding on Port 5000."
              echo "========== API CONTAINER LOGS =========="
              docker compose -f docker-compose.prod.yml logs api --tail=50
              echo "========================================"
              exit 1
            fi

            # 5. Cleanup — dangling build layers
            echo "Health check passed. Cleaning up..."
            docker image prune -f
